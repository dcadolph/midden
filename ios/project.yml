name: Midden
options:
  bundleIdPrefix: com.dcadolph
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set MIDDEN_DEV_TEAM to your Apple developer team before generating the
    # project. Simulator builds do not need it.
    DEVELOPMENT_TEAM: ${MIDDEN_DEV_TEAM}
    CODE_SIGN_STYLE: Automatic

targets:
  Midden:
    type: application
    platform: iOS
    sources:
      - path: Midden
    dependencies:
      - framework: Frameworks/MiddenCore.xcframework
        embed: true
        codeSign: true
    settings:
      base:
        # A bundle identifier belongs to exactly one Apple team forever, and a
        # free-provisioning install claims it permanently, so the identifier a
        # device build used cannot later be moved to a paid team.
        PRODUCT_BUNDLE_IDENTIFIER: com.dcadolph.middenjournal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Midden
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Midden records your voice so a spoken entry can be transcribed into your journal.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Midden transcribes your speech on this device so you can journal without typing.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1,2"
